name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag/version
        id: ver
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ github.event.inputs.tag }}" }
          else { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Force -Scope CurrentUser

      - name: Build EXE
        shell: powershell
        run: |
          Import-Module ps2exe
          $a = @{
            inputFile   = 'CleanApp.ps1'
            outputFile  = 'DiskCleaner.exe'
            noConsole   = $true
            requireAdmin= $true
            title       = 'Disk & RAM Cleaner'
            description = 'Disk & RAM Cleaner by Mohammed Majid'
            company     = 'Mohammed Majid'
            product     = 'Disk Cleaner'
            copyright   = '(c) 2026 Mohammed Majid'
            version     = '${{ steps.ver.outputs.version }}'
          }
          if (Test-Path 'icon.ico') { $a['iconFile'] = 'icon.ico' }
          Invoke-ps2exe @a
          if (-not (Test-Path 'DiskCleaner.exe')) { throw 'Build failed' }

      - name: Generate SHA256 checksum
        shell: powershell
        run: |
          (Get-FileHash 'DiskCleaner.exe' -Algorithm SHA256).Hash | Out-File 'DiskCleaner.exe.sha256' -Encoding ascii

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Disk & RAM Cleaner ${{ steps.ver.outputs.tag }}
          files: |
            DiskCleaner.exe
            DiskCleaner.exe.sha256
