name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve tag/version
        id: ver
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ github.event.inputs.tag }}" }
          else { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish single-file EXE
        shell: powershell
        run: |
          dotnet publish src/DiskCleaner.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish
          if (-not (Test-Path 'publish/DiskCleaner.exe')) { throw 'Publish failed' }

      - name: Generate SHA256 checksum
        shell: powershell
        run: |
          (Get-FileHash 'publish/DiskCleaner.exe' -Algorithm SHA256).Hash | Out-File 'publish/DiskCleaner.exe.sha256' -Encoding ascii

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Disk & RAM Cleaner ${{ steps.ver.outputs.tag }}
          files: |
            publish/DiskCleaner.exe
            publish/DiskCleaner.exe.sha256
